# Server Configuration
server.port=${PORT:8080}
spring.application.name=tictactoe-arena-backend

# WebSocket / STOMP Configurations
spring.messages.basename=messages

# CORS Allowed Origins (Comma-separated for local dev and production frontends)
# Override in production via environment variable: ALLOWED_ORIGINS=https://your-frontend.vercel.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://127.0.0.1:3000,https://*.vercel.app}

# Logging configuration
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO
logging.level.com.arena.tictactoe=DEBUG
